<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Quitandaria da Gôda | Cadastro</title>
</head>
<body>
       
    <form action="1.login.html" method="post" class="cadastro-box">
        
         <div class="logo-icone-inicio">
            <span class="emojis">🍅🫛🥕</span>
         </div>
          
        <h2 class="cadastro-cliente" >Cadastro de Clientes</h2> 
        <p class="cadastro-cliente">Faça seu cadastro para acessar nossa plataforma e garantia as  melhores promoções!!</p>
        <div class="campo">
            <label for="nome-cadastro">Nome Completo</label>
            <input type="text" id="nome-cadastro" placeholder="Digite seu nome completo">
        </div>
        <div class="campo">
            <label for="email-cadastro">E-mail</label>
            <input type="email" id="email-cadastro" placeholder="Digite seu e-mail">
        </div>
        <div class="campo">
            <label for="usuario-cadastro">Usuário</label>
            <input type="text" id="usuario-cadastro" placeholder="Digite seu usuário">
        </div>
        <div class="campo">
            <label for="senha-cadastro">Senha</label>
            <input type="password" id="senha-cadastro" placeholder="Digite sua senha">
        </div>
        <div class="campo">
            <label for="confirmar-senha-cadastro">Confirmar Senha</label>
            <input type="password" id="confirmar-senha-cadastro" placeholder="Confirme sua senha">
        </div>
        <div class="campo">
            <label for="telefone-cadastro">Telefone</label>
            <input type="text" id="telefone-cadastro" placeholder="Digite seu telefone">
        </div>
        <button type="submit" id="cadastrar-btn">Cadastrar</button>
    </form>
    <footer class="footer">
        <p>&copy; 2026 Quitandaria da Gôda. Todos os direitos reservados. Organizações Tabajara.</p>
</body>
</html>
