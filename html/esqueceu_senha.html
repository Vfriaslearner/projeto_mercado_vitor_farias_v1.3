<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha ? | Quitandaria da Gôda</title>
    <link rel="stylesheet" href="../css/estilo.css">

<body>
    <div class="esqueceu-senha-container">
        <div class="conteudo-principal-centralizado"> 
        <h1 class="esqueceu-senha-titulo">Esqueceu a Senha?</h1><br>
        <p class="esqueceu-senha-texto">Digite seu e-mail cadastrado para receber instruções de redefinição de senha.</p><br>
        
        <form action="login.html" method="post" class="esqueceu-senha-form">
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" placeholder="Digite Seu E-mail">
            
            <button type="submit">Enviar</button>
        </form>

        <a href="login.html" class="voltar-login-link">Voltar para Login</a>
    </div>
